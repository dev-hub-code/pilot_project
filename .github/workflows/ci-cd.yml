# CI on every pull request and push to main: backend tests, frontend typecheck, lint and build.
# CD on every push to main that passes CI: build the images, push them to ECR and roll them out to ECS
# (infra/ecs/rollout.sh). AWS access is a short-lived OIDC role (no stored keys), limited to the "production"
# environment; add required reviewers to that environment on GitHub to approve each deployment by hand.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Integration tests start PostgreSQL and Kafka with Testcontainers (Docker is on the runner).
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://www.sealease.in
    # One deployment at a time, never cancelled half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # The tags are immutable: a re-run for the same commit reuses the images already pushed.
      - name: Images already in ECR
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for app in backend frontend; do
            if aws ecr describe-images --repository-name "sealease/$app" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Build and push backend
        if: steps.existing.outputs.backend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sealease/backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        if: steps.existing.outputs.frontend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sealease/frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Roll out
        run: infra/ecs/rollout.sh "${{ steps.tag.outputs.tag }}"
