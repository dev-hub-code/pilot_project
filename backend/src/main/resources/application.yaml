# =====================================================================================
# Base configuration shared by all profiles.
# Secrets and environment-specific values come from environment variables. The local
# profile additionally reads a git-ignored .env file (see .env.example at repo root).
# =====================================================================================
spring:
  application:
    name: sealease-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sealease}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:sealease-backend}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      isolation-level: read-committed
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # KYC evidence: up to 4 files of app.documents.max-file-size each.
      max-file-size: 5MB
      max-request-size: 22MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Tomcat RemoteIpValve: X-Forwarded-For is honoured only when the immediate peer is a trusted
  # proxy (Tomcat's default: private and loopback ranges; override with
  # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES), and the client IP is the right-most untrusted entry -
  # so clients cannot spoof their address to dodge rate limits or falsify audit records.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{requestId:-}] "

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  version: ${APP_VERSION:dev}
  auth:
    default-role: ${APP_AUTH_DEFAULT_ROLE:INVESTOR}
    jwt:
      issuer: ${JWT_ISSUER:https://api.sealease.local}
      audience: ${JWT_AUDIENCE:sealease-api}
      # PEM files, e.g. file:/run/secrets/jwt-private.pem. Generate locally with scripts/generate-jwt-keys.sh.
      private-key: ${JWT_PRIVATE_KEY_LOCATION}
      public-key: ${JWT_PUBLIC_KEY_LOCATION}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      clock-skew: 30s
    session:
      refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
      max-lifetime: ${AUTH_SESSION_MAX_LIFETIME:30d}
      reuse-grace-period: 10s
    lockout:
      max-failed-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      lock-duration: ${AUTH_LOCKOUT_DURATION:15m}
    rate-limit:
      login-per-ip: { requests: 20, window: 1m }
      login-per-email: { requests: 10, window: 15m }
      register-per-ip: { requests: 5, window: 1h }
      refresh-per-ip: { requests: 60, window: 1m }
      password-change-per-user: { requests: 10, window: 15m }
  crypto:
    # Field-level AES-256-GCM keys, "keyId:base64Key[,keyId:base64Key...]". Generate with
    # scripts/generate-encryption-keys.sh. Keep retired keys listed so old data stays readable.
    data-keys: ${APP_CRYPTO_DATA_KEYS}
    active-key-id: ${APP_CRYPTO_ACTIVE_KEY_ID}
    fingerprint-key: ${APP_CRYPTO_FINGERPRINT_KEY}
  documents:
    max-file-size: 5MB
  bootstrap:
    super-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  money:
    default-currency: ${APP_DEFAULT_CURRENCY:USD}
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  orders:
    payment-window: ${APP_ORDER_PAYMENT_WINDOW:30m}
    expiry-sweep-interval: 60s
  outbox:
    poll-interval: ${APP_OUTBOX_POLL_INTERVAL:1s}
  payments:
    # Shown to investors paying by bank transfer. Required: startup fails when unset.
    bank-transfer:
      beneficiary-name: ${PAYMENT_BANK_BENEFICIARY_NAME:}
      iban: ${PAYMENT_BANK_IBAN:}
      bic: ${PAYMENT_BANK_BIC:}
      bank-name: ${PAYMENT_BANK_NAME:}
    simulator:
      enabled: false
  invoice:
    # Printed on (and copied into) every invoice. Required: startup fails when unset.
    issuer-name: ${INVOICE_ISSUER_NAME:}
    issuer-address: ${INVOICE_ISSUER_ADDRESS:}
    issuer-tax-id: ${INVOICE_ISSUER_TAX_ID:}
    notes: ${INVOICE_NOTES:}
  kafka:
    create-topics: false
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    retry:
      max-retries: ${KAFKA_RETRY_MAX_RETRIES:4}
      initial-interval: ${KAFKA_RETRY_INITIAL_INTERVAL:500ms}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval: ${KAFKA_RETRY_MAX_INTERVAL:10s}
