# Integration-test profile. Connection details come from Testcontainers @ServiceConnection beans;
# these values only satisfy the required placeholders in application.yaml.
DB_USERNAME: overridden-by-testcontainers
DB_PASSWORD: overridden-by-testcontainers

# Test-only encryption keys (two keys to exercise rotation). Never use outside tests.
APP_CRYPTO_DATA_KEYS: "t1:K/rki3gS2prDYo1Q1XuQfDF9V3r4MOOvVLezrUl8EuY=,t2:Wr5fuwFgyi2yttGMF6zjl+xkK8nGrhAqXZLtELw+6+c="
APP_CRYPTO_ACTIVE_KEY_ID: t2
APP_CRYPTO_FINGERPRINT_KEY: "p8dOVQGnnHFMqp9KxXQ4385DAzggIBeuU0XWEwyKl8k="
JWT_PRIVATE_KEY_LOCATION: classpath:jwt/test-only-private.pem
JWT_PUBLIC_KEY_LOCATION: classpath:jwt/test-only-public.pem

app:
  bootstrap:
    super-admin:
      email: root-admin@sealease.test
      password: Super-Admin-2026!
  auth:
    session:
      # Deterministic theft detection: any replay of a consumed refresh token revokes the session.
      reuse-grace-period: 0s
    rate-limit:
      # Integration tests sign in many times from the same address.
      login-per-ip: { requests: 10000, window: 1m }
      register-per-ip: { requests: 10000, window: 1m }
      refresh-per-ip: { requests: 10000, window: 1m }
    # Most tests sign up and use the account at once; email verification has its own test.
    email-verification:
      required: false
  bank-accounts:
    # No network in tests: IFSC codes are checked by format only (IfscDirectoryTest covers the lookup).
    ifsc-lookup:
      enabled: false
  crm:
    # Integration tests submit the interest form from one address.
    public-form-per-ip: { requests: 10000, window: 1m }
  kafka:
    create-topics: true
    partitions: 1
  # Tests run background jobs (outbox relay, order expiry) explicitly.
  scheduling:
    enabled: false
  invoice:
    issuer-name: SeaLease Test Ltd
    issuer-address: 1 Test Street, Rotterdam, NL
    issuer-tax-id: NL000000000B01
  # Tests compare dates with UTC "today": statements and reports use UTC days too.
  display:
    time-zone: UTC
  # Withdrawal rules are tested against fixed limits, independent of the production defaults.
  withdrawals:
    minimum-amount: 50
    dual-approval-threshold: 10000

# Tests build the schema with the Flyway scripts (seed data, triggers, locations) and check the entities against it.
spring:
  flyway:
    enabled: true
    # Schema only: tests create their own super admin and plans.
    locations: classpath:db/migration
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
